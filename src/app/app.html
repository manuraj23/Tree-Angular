<div class="container">

  <h1>Tree View</h1>

  <div class="tree-actions">
    <label for="new-node-name">Name</label>
    <input
      id="new-node-name"
      type="text"
      placeholder="new item"
      [(ngModel)]="newNodeName"
    />
    <button type="button" (click)="addNode('file')">Add file</button>
    <button type="button" (click)="addNode('folder')">Add folder</button>
  </div>

  <app-tree-view
    [data]="treeData"
    [defaultExpandedIds]="['1', '2', '3', '9']"
    (nodeSelect)="onNodeSelected($event)"
    (nodeToggle)="onNodeToggled($event)"
  />

  @if (selectedNode) {

    <p>
      Selected:
      <strong>
        {{ selectedNode.name }}
      </strong>
    </p>

  }

</div>
